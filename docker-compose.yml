#version: '3.8'

services:
  dms_api:
    build:
      context: .
      dockerfile: DocumentManagementSystem/API/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=dms_db;Port=5432;Username=postgres;Password=postgres;Database=dmsdb
    networks:
      - app-network
    depends_on:
      - dms_db

  dms_ui:
    build:
      context: DocumentManagementSystem/UI
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    networks:
      - app-network
    depends_on:
      - dms_api
  
  dms_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dmsdb
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - dbdata:/var/lib/postgresql/data

networks:
  app-network:
    driver: bridge

volumes:
  dbdata: