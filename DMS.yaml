openapi: 3.0.0
info:
  title: Document Management System API
  description: A REST API for managing documents in the Document Management System
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local development server
paths:
  /documents:
    get:
      summary: Retrieve a list of documents
      description: Returns a list of documents with metadata. This is a hardcoded response for testing.
      responses:
        '200':
          description: A list of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
    post:
      summary: Upload a new document
      description: Upload a document with metadata. This is a placeholder that returns a hardcoded response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocument'
      responses:
        '201':
          description: Document created
        '400':
          description: Invalid input

  /documents/{documentId}:
    get:
      summary: Retrieve a specific document
      description: Returns the metadata for a specific document.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The ID of the document to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Document found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
    put:
      summary: Update a document's metadata
      description: Update the metadata of a specific document.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The ID of the document to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocument'
      responses:
        '200':
          description: Document updated
        '400':
          description: Invalid input
        '404':
          description: Document not found
    delete:
      summary: Delete a document
      description: Delete a specific document by ID.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The ID of the document to delete
          schema:
            type: string
      responses:
        '204':
          description: Document deleted
        '404':
          description: Document not found

components:
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the document
        name:
          type: string
          description: Name of the document
        size:
          type: integer
          description: Size of the document in bytes
        uploadedAt:
          type: string
          format: date-time
          description: The date and time when the document was uploaded
    NewDocument:
      type: object
      properties:
        name:
          type: string
          description: Name of the document
        content:
          type: string
          format: binary
          description: The content of the document (binary data)
      required:
        - name
        - content
    UpdateDocument:
      type: object
      properties:
        name:
          type: string
          description: Updated name of the document
      required:
        - name
